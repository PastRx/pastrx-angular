<app-header [inputTitle]="appTitle"></app-header>
<div class="row m-0" [hidden]="showMaps || showPMP">
    <div class="col-10 p-2" [hidden]="showAlerts">
        <div class="card rounded-0 mat-elevation-z4">
            <app-patient-graphs [tdeGraphData]="tdeGraphData" [reportData]="reportData"></app-patient-graphs>
        </div>
    </div>
    <div class="col-2 p-2" [ngClass]="{'col-12':showAlerts,'col-2':!showAlerts}">
        <div class="card rounded-0 mat-elevation-z4 h-100">
            <div class="card-header bg-gray rounded-0 text-white py-1 px-2 fw-500">
                {{alertstitle}}
                <mat-icon aria-hidden="false" class="hicon float-end ms-2" [hidden]="showAlerts == true" fontIcon="web_asset" (click)="showAlerts = true;"></mat-icon>
                <mat-icon aria-hidden="false" class="hicon float-end ms-2" [hidden]="showAlerts == false" fontIcon="close" (click)="showAlerts = false;"></mat-icon>
                <mat-icon aria-hidden="false" class="hicon float-end" fontIcon="help"></mat-icon>
            </div>
            <div class="card-body">
                <div *ngIf="loadingAlerts" class="text-center py-3">                    
                    <div class="mt-2">Loading Alerts...</div>
                </div>
                <div class="accordion accordion-flush row" id="accordionFlushExample" *ngIf="!loadingAlerts">
                    <div class="accordion-item px-1" *ngFor="let alertGroup of alertsList; let i = index">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed p-2" type="button" [attr.data-bs-toggle]="'collapse'"
                                [attr.data-bs-target]="'#flush-collapse' + i" aria-expanded="false"
                                [attr.aria-controls]="'flush-collapse' + i">
                                <b>{{alertGroup.count}} </b> <span class="fw-normal ms-2">{{alertGroup.typeString}}</span>
                            </button>
                        </h2>
                        <div [id]="'flush-collapse' + i" class="accordion-collapse collapse"
                            data-bs-parent="#accordionFlushExample">
                            <div class="accordion-body">
                                <small class="row d-block mb-2" *ngFor="let alert of alertGroup.alerts">
                                    <span *ngIf="alert.narrative">{{alert.narrative}}</span>
                                    <span *ngIf="!alert.narrative && alert.description">{{alert.description}}</span>
                                    <span *ngIf="!alert.narrative && !alert.description">{{alert.typeString}}</span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row m-0" [hidden]="showAlerts" [style.height]="showMaps ? 'calc(100vh - 70px - 30px)' : 'auto'" style="margin-bottom: 0;">
    <app-patient-map class="col-6 p-2" [ngClass]="{'col-12':showMaps,'col-6':!showMaps}" [showMaps]="showMaps" (showMapsChange)="showMaps = $event" [reportData]="reportData" [patientName]="patientName" [hidden]="showPMP"></app-patient-map>
    <div class="col-6 p-2" [ngClass]="{'col-12':showPMP,'col-6':!showPMP}" [hidden]="showMaps">
        <div class="card rounded-0 mat-elevation-z4 h-100">
            <div class="card-header bg-gray rounded-0 text-white py-1 px-2 fw-500">
                PMP
                <mat-icon aria-hidden="false" class="hicon float-end ms-2" [hidden]="showPMP == true" fontIcon="web_asset" (click)="showPMP = true;"></mat-icon>
                <mat-icon aria-hidden="false" class="hicon float-end ms-2" [hidden]="showPMP == false" fontIcon="close" (click)="showPMP = false;"></mat-icon>
                <mat-icon aria-hidden="false" class="hicon float-end" fontIcon="help"></mat-icon>
            </div>
            <div class="card-body" *ngIf="shwrpt">
                <iframe src="assets/report/index.html" id="pastrx-report-container" scrolling="yes" horizontalscrolling="no" verticalscrolling="yes" style="border:none; width:100%; height: 100%; -ms-overflow-style: -ms-autohiding-scrollbar;"></iframe>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
