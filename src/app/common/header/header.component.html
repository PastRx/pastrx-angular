<div class="row m-0 bg-gray py-2 align-items-center">
    <div class="col-1 d-flex align-items-center">
        <img alt="PastRx" src="../../../assets/white-logo-80.png" class="logocnt">     
    </div>
    <div class="col d-flex align-items-center">
        <h3 class="text-white fw-normal my-0"> {{inputTitle}}</h3>  
    </div>
    <div class="col-8 text-white d-flex align-items-center justify-content-end gap-3">
        <div class="d-flex justify-content-end gap-3" [hidden]="currentRout == '/admin-dashboard'">
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" routerLink="/admin-dashboard">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="settings-applications"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Admin</small>
            </span>        
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" (click)="onClick()">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="date_range"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Set Date</small>
            </span>
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" (click)="refreshPage()">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="refresh"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Refresh</small>
            </span>
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" (click)="openRemoveDialog()">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="do_not_disturb_on"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Remove</small>
            </span>
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" (click)="openBatchpdfDialog()">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="print"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Batch PDF</small>
            </span>
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" (click)="openFeedbackDialog()">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="report-problem"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">Feedback</small>
            </span>
        </div>
        <div class="d-flex justify-content-end gap-3" [hidden]="currentRout != '/admin-dashboard'">
            <span class="d-inline-flex flex-column align-items-center text-center gap-1">
                <button mat-icon-button class="d-flex align-items-center justify-content-center p-0" routerLink="/user-dashboard">
                    <mat-icon aria-hidden="false" class="hicon" fontIcon="exit_to_app"></mat-icon>
                </button>
                <small class="d-block lh-1 text-nowrap">App</small>
            </span>  
        </div>
    </div>
</div>
