<div class="modal fade" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen-padded">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="helpModalLabel">PASTRx Help - {{helpTitle}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="close()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div *ngIf="loading" class="text-center py-4">
          <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
          </div>
          <div class="mt-2">Loading help content...</div>
        </div>
        
        <div *ngIf="error" class="alert alert-danger" role="alert">
          {{error}}
        </div>
        
        <div *ngIf="!loading && !error">
          <img *ngIf="contentType === 'image'" 
               [src]="imagePath" 
               class="img-fluid help-content-image" 
               alt="Help Image"
               style="max-width: 100%; height: auto;">
          
          <div *ngIf="contentType === 'html'" 
               class="help-content-html"
               [innerHTML]="content">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="close()">Close</button>
      </div>
    </div>
  </div>
</div>
