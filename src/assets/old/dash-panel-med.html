<link rel="import" href="../bower_components/iron-icons/notification-icons.html">
<link rel="import" href="../bower_components/iron-icon/iron-icon.html">
<link rel="import" href="../bower_components/iron-iconset-svg/iron-iconset-svg.html">
<link rel="import" href="../bower_components/iron-icons/iron-icons.html">
<link rel="import" href="../stylesheets/pastrx-shared-styles.html">


<dom-module id="dash-panel-med">
    <style include="pastrx-shared-styles">
        :host {
            display: block;
            padding-left: 0px;
            text-align: center;
            overflow: hidden;
            @apply(--layout-horizontal);
        }

        canvas {
            width: 98%;
            height: 250px;
            position: absolute;
            left: 0;
            bottom: 0;
        }
        .container{
            position: relative;
            width: 100%;
        }
        .legend{
            font-family: 'Lato', sans-serif;
            font-size: 10px;
            width: 50px;
            line-height: 80%;
            @apply(--layout-vertical);
            @apply(--layout-center);
            border: solid;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            margin-top: 4px;
            margin-left: 2px;
            border-width: thin;
            padding: 6px 0 6px 0;
        }
        /*for IE 10*/
        .legend > div{
            width: 50px;
        }
        #activesButton{
            width: 35px;
            height: 35px;
            margin-top: 20px;
            color: #ffffff;
            cursor: pointer;
        }
        .column{
            @apply(--layout-vertical);
        }
        iron-icon{
            padding-top: 2px;
            padding-bottom: 2px;
        }
        .legendTitle{
            font-size: 11px;
            font-weight: bold;
        }
    </style>


    <template>
        <iron-iconset-svg name="custom-icons" size="50">
            <svg>
                <defs>
                    <g id="circle">
                        <circle cx="25" cy="25" r="18" />
                    </g>
                </defs>
            </svg>
        </iron-iconset-svg>
        <div class="column">
            <div class="label OPIOID">Opioid</div>
            <div class="legend">
                <span class="legendTitle">Legend</span>
                <iron-icon id="redAlert" icon="custom-icons:circle" ></iron-icon>
                <div>High Dose<br>or<br>Multiple Prescriber Same Category</div>
                <iron-icon id="yellowAlert" icon="custom-icons:circle" ></iron-icon>
                <div>Multiple Prescriber Different Category</div>
                <iron-icon id="blueAlert" icon="custom-icons:circle" ></iron-icon>
                <div>Single Prescriber</div>
            </div>
        </div>
        <div class="container">
            <div id="loadingDialogue">Loading Data...</div>
            <canvas id="medCanvas">Your browser does not support the HTML5 canvas tag.</canvas>
        </div>
    </template>

</dom-module>

    <script>
        window.addEventListener('polymer-ready', function(e) {
            console.log('polymer-ready('+this.offsetWidth+')');
        });



        Polymer({
            is: "dash-panel-med",
            created: function() {
                // console.log('created:');
                },
            ready: function() {
                // console.log('ready:');
                // console.log(this.$.medCanvas);
                },

            attached: function() {
                // console.log('attached:');
                window.addEventListener("resize", function (e) {
                    this.refresh();
                    }.bind(this));
                var m = this.$.medCanvas;
                m.addEventListener('click', function (e) {
                    this.on_canvas_click(e);}.bind(this)
                        , false);
                this.$.redAlert.style.fill    = PASTRX.red;
                this.$.yellowAlert.style.fill = PASTRX.yellow;
                this.$.blueAlert.style.fill   = PASTRX.blue;
            },

            on_canvas_click: function(ev) {
                var m = this.$.medCanvas;
                PASTRX.selectActivesInCanvas(ev, m);
            },

            detached: function() { console.log('detached:'); console.log(this.$.medCanvas);  },

            refresh: function() {
                // console.log('refresh:');
                var m = this.$.medCanvas;
                PASTRX.clearCanvas(m);
                if(this.clientHeight != undefined && this.clientHeight > 10){
                    m.parentNode.style.height = this.clientHeight + "px";
                }
                var panelWidth = $('#med').outerWidth();
                var legendPanelWidth = 50;
                var medCanvasWidth = panelWidth - legendPanelWidth - 12; //leave padding space
                document.querySelector('#medCanvas').style.width = medCanvasWidth + "px";
                PASTRX.plotTDEData(PASTRX.tdeGraphData, m, "OPIOID");
            }
        });
    </script>
