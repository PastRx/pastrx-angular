<link rel="import" href="../stylesheets/pastrx-shared-styles.html">

<dom-module id="dash-panel-benzos">
    <style include="pastrx-shared-styles">
        :host {
            display: block;
            padding-left: 0px;
            text-align: center;
            overflow: hidden;
        @apply(--layout-horizontal);
        }

        canvas {
            width: 98%;
            height: 24px;
            position: absolute;
            left: 0;
            bottom: 0;
        }
        .container{
            position: relative;
            width: 100%;
        }
    </style>


    <template>
        <div class="label BENZODIAZEPINES">BENZ</div>
        <div class="container">
            <div id="loadingDialogue" class="">Loading Data...</div>
            <canvas id="benzoCanvas">Your browser does not support the HTML5 canvas tag.</canvas>
        </div>
    </template>

</dom-module>

<script>
    window.addEventListener('polymer-ready', function(e) {
        console.log('polymer-ready('+this.offsetWidth+')');
    });

    Polymer({
        is: "dash-panel-benzos",
        created: function() {
            },
        ready: function() {

        },

        attached: function() {
            window.addEventListener("resize", function (e) {
                this.refresh();
            }.bind(this));
            var m = this.$.benzoCanvas;
            m.addEventListener('click', function (e) {
                        this.on_canvas_click(e);}.bind(this)
                    , false);
        },

        detached: function() { console.log('detached:'); console.log(this.$.benzoCanvas);  },
        on_canvas_click: function(ev) {
            var m = this.$.benzoCanvas;
            PASTRX.selectActivesInCanvas(ev, m);
        },

        refresh: function() {
            var p = document.querySelector('iron-pages');
            if(p.selected == 2) { //Only reload if on the page.  NOTE now on the integrated dash.
                console.log('refresh:');
                var m = this.$.benzoCanvas;
                PASTRX.clearCanvas(m);
                if(this.clientHeight != undefined && this.clientHeight > 10){
                    m.parentNode.style.height = this.clientHeight + "px";
                    var panelWidth = $('#benzos').outerWidth();
                    var legendPanelWidth = 50;
                    var canvasWidth = panelWidth - legendPanelWidth - 10; //leave padding space
                    document.querySelector('#benzoCanvas').style.width = canvasWidth + "px";
                }
                PASTRX.plotStimOrBenzoData(PASTRX.tdeGraphData, m, "BENZODIAZEPINES");

            }
        }
    });
</script>
